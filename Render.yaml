services:
  - type: web
    name: nifty-bot-trend-fib-auto-token
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Or use starter for 24/7 no sleep: plan: starter ( $7/month )
    envVars:
      - key: ANGEL_API_KEY
        sync: false
      - key: ANGEL_CLIENT_ID
        sync: false
      - key: ANGEL_PASSWORD
        sync: false
      - key: ANGEL_TOTP_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MAX_DAILY_LOSS
        value: 1500
      - key: MAX_TRADES
        value: 5
      - key: NIFTY_QTY
        value: 65
      - key: PORT
        value: 10000
    healthCheckPath: /
    autoDeploy: false
